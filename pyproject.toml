[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-cleaner"
version = "0.1.0"
description = "Clean scanned two-page book spreads with deferred gutter removal and text-aware enhancement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
]

[project.scripts]
scan-cleaner = "scan_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scan_cleaner*"]
